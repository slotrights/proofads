[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
solc_version = "0.8.30"
ignored_warnings_from = ["lib/"]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.default.fmt]
line_length = 110
tab_width = 4

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
