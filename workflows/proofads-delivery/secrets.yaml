# ==========================================================================
# CRE SECRETS — ProofAds
# ==========================================================================
# PROOFADS_API_TOKEN is the bearer token that authorises reading a raw
# measurement batch from the ProofAds collector. It is released by the Vault DON
# directly into the attested enclave; node operators never see its plaintext,
# and the workflow never logs it.
secretsNames:
    PROOFADS_API_TOKEN:
        - SECRET_PROOFADS_API_TOKEN
